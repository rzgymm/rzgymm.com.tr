backend:
  name: github
  repo: rzgymm/rzgymm.com.tr
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site_settings
    label: Site Ayarları
    icon: settings
    files:
      - name: global
        label: Genel Bilgiler
        file: src/data/site.json
        fields:
          - { label: Site Adı, name: siteName, widget: string }
          - { label: Kısa Ad, name: shortName, widget: string }
          - { label: Logo Görseli, name: logoImage, widget: image, required: false }
          - { label: Logo Alt Metni, name: logoAlt, widget: string, required: false }
          - { label: Üst Logo Alt Metni, name: logoTagline, widget: string }
          - { label: Footer Marka Başlığı, name: footerBrandName, widget: string, required: false }
          - { label: Telefon (Görünen), name: phoneDisplay, widget: string }
          - { label: Telefon (Link), name: phoneHref, widget: string }
          - { label: E-posta, name: email, widget: string }
          - { label: Adres, name: address, widget: text }
          - { label: Harita Embed URL, name: mapsEmbed, widget: string }
          - { label: Varsayılan Hero Görseli URL, name: heroDefaultImage, widget: string }
          - { label: Footer Metni, name: footerText, widget: text }
          - label: Ana Menü
            name: mainMenu
            widget: list
            fields:
              - { label: Metin, name: label, widget: string }
              - { label: URL, name: href, widget: string, required: false }
              - { label: Tür, name: type, widget: select, options: [link, services] }
          - label: Hizmetlerimiz Açılır Menü
            name: serviceMenu
            widget: list
            fields:
              - { label: Metin, name: label, widget: string }
              - { label: URL, name: href, widget: string }

  - name: pages
    label: Site Sayfaları
    icon: article
    files:
      - name: home
        label: Anasayfa
        file: src/data/pages/home.json
        fields:
          - { label: Sayfa Yolu, name: path, widget: string, hint: "Örn: /", required: true }
          - { label: Menü Başlığı, name: menuLabel, widget: string }
          - { label: Meta Başlık, name: metaTitle, widget: string }
          - { label: Meta Açıklama, name: metaDescription, widget: text }
          - { label: Hero Etiket, name: heroBadge, widget: string }
          - { label: Hero Başlık, name: heroTitle, widget: string }
          - { label: Hero Açıklama, name: heroDescription, widget: text }
          - { label: Hero Görsel URL, name: heroImage, widget: string }
          - { label: Hero Buton Metni, name: heroCtaLabel, widget: string, required: false }
          - { label: Hero Buton Linki, name: heroCtaHref, widget: string, required: false }
          - label: Intro Vurgu Kutuları
            name: introHighlights
            widget: list
            required: false
            fields:
              - { label: Başlık, name: title, widget: string }
              - { label: Açıklama, name: description, widget: text }
          - label: Hizmet Kartları
            name: serviceCards
            widget: list
            fields:
              - { label: Başlık, name: title, widget: string }
              - { label: Açıklama, name: description, widget: text }
              - { label: Link, name: href, widget: string }
              - { label: Görsel URL, name: image, widget: string }
              - { label: Görsel Alt Metin, name: imageAlt, widget: string, required: false }
          - { label: Sayfa İçeriği, name: body, widget: markdown }

      - name: kurumsal
        label: Kurumsal
        file: src/data/pages/kurumsal.json
        fields:
          - { label: Sayfa Yolu, name: path, widget: string, hint: "Örn: /kurumsal/", required: true }
          - { label: Menü Başlığı, name: menuLabel, widget: string }
          - { label: Meta Başlık, name: metaTitle, widget: string }
          - { label: Meta Açıklama, name: metaDescription, widget: text }
          - { label: Hero Etiket, name: heroBadge, widget: string }
          - { label: Hero Başlık, name: heroTitle, widget: string }
          - { label: Hero Açıklama, name: heroDescription, widget: text }
          - { label: Hero Görsel URL, name: heroImage, widget: string }
