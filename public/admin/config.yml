  - name: news_posts
    label: Haber Yazıları
    icon: article
    files:
      - name: posts
        label: Haber İçerikleri
        file: src/data/haberler.json
        fields:
          - label: Yazılar
            name: posts
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Slug, name: slug, widget: string, hint: "Örn: 2026-vergi-takvimi-kritik-tarihler" }
              - { label: Başlık, name: title, widget: string }
              - { label: Kısa Özet, name: excerpt, widget: text }
              - { label: Tarih (YYYY-MM-DD), name: date, widget: string }
              - { label: Kapak Görsel URL, name: coverImage, widget: string }
              - { label: İçerik, name: body, widget: markdown }

  - name: announcement_posts
    label: Duyuru Yazıları
    icon: article
    files:
      - name: posts
        label: Duyuru İçerikleri
        file: src/data/duyurular.json
        fields:
          - label: Yazılar
            name: posts
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Slug, name: slug, widget: string, hint: "Örn: e-defter-yukleme-takvimi-2026" }
